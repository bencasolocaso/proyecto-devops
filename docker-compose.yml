services:

  mysql:

    image: mysql:8

    container_name: mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: despacho

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  ventas:

    build:
      context: ./back-Ventas_SpringBoot/Springboot-API-REST
      dockerfile: ../dockerfile

    container_name: ventas-api

    restart: always

    depends_on:
      - mysql

    environment:
      DB_ENDPOINT: mysql
      DB_PORT: 3306
      DB_NAME: ventas
      DB_USERNAME: root
      DB_PASSWORD: root

    ports:
      - "8081:8080"

  despacho:

    build:
      context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
      dockerfile: ../dockerfile

    container_name: despacho-api

    restart: always

    depends_on:
      - mysql

    environment:
      DB_ENDPOINT: mysql
      DB_PORT: 3306
      DB_NAME: despacho
      DB_USERNAME: root
      DB_PASSWORD: root

    ports:
      - "8082:8081"

  frontend:

    build:
      context: ./front_despacho

    container_name: frontend-app

    restart: always

    depends_on:
      - ventas
      - despacho

    ports:
      - "80:80"

volumes:
  mysql_data:
